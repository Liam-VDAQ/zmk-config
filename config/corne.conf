# Deep sleep. Not on by default, and without it the board never powers down
# -- the single biggest drain on a wireless split. 30 min of inactivity.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Connection and security changes that ZMK plans to make default. The
# security half implies BT_SMP_ALLOW_UNAUTH_OVERWRITE, which lets a new
# pairing replace an existing unauthenticated bond rather than refusing
# it -- the cause of a host that starts pairing and then hangs.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Battery level over BLE, and the peripheral half's level proxied through
# the central so both show up on the host.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Mouse layer: pointer movement, clicks and scroll behaviours.
CONFIG_ZMK_POINTING=y

# Name shown when pairing.
CONFIG_ZMK_KEYBOARD_NAME="LTCORNE"

# Stronger BLE transmit. Zephyr option, so it is not in the ZMK tree and
# cannot be verified from here -- uncomment if the wireless link drops.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Corne RGB underglow. This board has no LEDs wired.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Corne OLED display.
# CONFIG_ZMK_DISPLAY=y
